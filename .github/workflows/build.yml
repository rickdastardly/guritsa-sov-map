# Build check on GitHub's Windows machines for every push (download the result under Actions).
# Releases are published from the same build.ps1 output that the website serves, so the
# hashes on GitHub and on gurista.co.uk always match.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: GuristaSovMap-windows
          path: target/release/sovmap.exe
